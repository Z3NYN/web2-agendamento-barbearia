spring.application.name=soldado-do-corte
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.address=${SOLDADO_BIND:0.0.0.0}
server.port=${SOLDADO_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
spring.datasource.url=${SOLDADO_DB_URL:jdbc:h2:file:./dados/barbearia;LOCK_TIMEOUT=15000}
spring.datasource.username=${SOLDADO_DB_USER:sa}
spring.datasource.password=${SOLDADO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.demo=${SOLDADO_DEMO:true}
app.admin-password=${SOLDADO_ADMIN_PASSWORD:}
jwt.secret=${SOLDADO_JWT_SECRET:}
jwt.validade-ms=${SOLDADO_JWT_TTL:28800000}
